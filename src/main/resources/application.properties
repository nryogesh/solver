# ============================================================
# Smart Equation Solver - Application Configuration
# ============================================================

# Server Port
server.port=8080

# Application Name
spring.application.name=smart-equation-solver

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.example.equationsolver=DEBUG
logging.level.root=INFO

# Tesseract OCR installation (install Tesseract OCR and the English trained data separately).
# Windows defaults: executable=C:/Program Files/Tesseract-OCR/tesseract.exe
#                   datapath=C:/Program Files/Tesseract-OCR/tessdata
# Linux: override both properties for the installed Tesseract paths.
tesseract.executable=C:/Program Files/Tesseract-OCR/tesseract.exe
tesseract.datapath=C:/Program Files/Tesseract-OCR/tessdata
tesseract.language=eng
